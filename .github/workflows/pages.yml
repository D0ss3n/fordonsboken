name: Publicera Fordonsboken

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4
      - name: Förbered GitHub Pages
        uses: actions/configure-pages@v5
      - name: Förbered Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Förbered Java för Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installera beroenden
        run: npm ci
      - name: Kör säkerhetsregler och modelltester
        run: npm run test:rules
      - name: Versionera klientfiler
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          version = os.environ["GITHUB_SHA"][:12]
          html = re.sub(r'(?<=\?v=)[^"&\s]+', version, html)
          path.write_text(html, encoding="utf-8")
          PY
      - name: Paketera webbplats
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicera webbplats
        id: deployment
        uses: actions/deploy-pages@v4

