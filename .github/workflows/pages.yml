name: Publicera Fordonsboken

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4
      - name: Förbered GitHub Pages
        uses: actions/configure-pages@v5
      - name: Versionera klientfiler
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          version = os.environ["GITHUB_SHA"][:12]
          html = re.sub(r'(?<=\?v=)[^"&\s]+', version, html)
          path.write_text(html, encoding="utf-8")
          PY
      - name: Paketera webbplats
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicera webbplats
        id: deployment
        uses: actions/deploy-pages@v4

