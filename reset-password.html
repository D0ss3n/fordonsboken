<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6f6f2">
  <title>Återställ lösenord – Fordonsmappen</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=tab-logo-20261006">
  <script src="theme.js?v=theme-persistence-20261026f"></script>
  <link rel="stylesheet" href="styles.css?v=dark-contrast-20261026">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper,#f6f6f2)}
    .reset-card{width:min(100%,480px);padding:clamp(24px,6vw,40px);background:#fff;border:1px solid var(--line,#e5e8e2);border-radius:24px;box-shadow:0 16px 50px #1a3d3510}
    .reset-brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;font-weight:750;font-size:18px}
    .reset-brand .brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--navy,#173f3a);color:#fff}
    .reset-brand svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .reset-card h1{margin:0 0 10px;font-size:clamp(25px,6vw,32px)}.reset-card>p{margin:0 0 26px;color:var(--muted,#77817c);line-height:1.55}
    .reset-field{margin:18px 0}.reset-field label{display:block;margin-bottom:7px;font-weight:650;font-size:14px}
    .reset-field input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line,#e5e8e2);border-radius:12px;font:inherit;color:var(--ink,#202b29);background:#fff}
    .reset-field input:focus{outline:3px solid #1b4b441f;border-color:var(--navy,#173f3a)}
    .reset-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px}.reset-actions .btn{min-height:48px}
    .reset-notice{margin-top:16px;padding:13px 15px;border-radius:12px;background:#f3f5f0;color:var(--ink,#202b29);line-height:1.5}.reset-notice[hidden]{display:none}
    .reset-card [hidden]{display:none!important}
    @media(max-width:420px){body{padding:14px}.reset-card{border-radius:20px}.reset-actions{align-items:stretch;flex-direction:column}.reset-actions .btn{width:100%}}
  </style>
</head>
<body>
  <main class="reset-card" aria-labelledby="reset-title">
    <div class="reset-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l2 2h9v8.2a1.8 1.8 0 0 1-1.8 1.8H5.3a1.8 1.8 0 0 1-1.8-1.8V7.5Z"/><path d="M3.5 9.5V6.8A1.8 1.8 0 0 1 5.3 5h4.1l2.1 2h5"/></svg></span>Fordonsmappen</div>
    <section id="reset-loading" aria-live="polite"><h1 id="reset-title">Kontrollerar återställningslänken</h1><p>Vänta medan länken verifieras.</p></section>
    <section id="reset-form-section" hidden>
      <h1 id="reset-title-form">Välj ett nytt lösenord</h1>
      <p id="reset-email"></p>
      <form id="reset-form">
        <div class="reset-field"><label for="new-password">Nytt lösenord</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="reset-field"><label for="confirm-password">Bekräfta lösenord</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="reset-actions"><button class="btn primary" type="submit">Spara nytt lösenord</button></div>
      </form>
    </section>
    <section id="reset-result" hidden aria-live="polite"><h1 id="result-title"></h1><p id="result-message"></p><div class="reset-actions"><a class="btn primary" id="return-link" href="index.html">Till Fordonsmappen</a></div></section>
    <p class="reset-notice" id="reset-error" role="alert" hidden></p>
  </main>
  <script type="module" src="reset-password.js?v=password-reset-page-20261012"></script>
</body>
</html>
